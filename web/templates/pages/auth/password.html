{{define "content"}}
<div class="pagehead"><div class="container pagehead-inner"><div>
  <h1>Change password</h1>
  <p class="sub">{{if .Data.Forced}}Choose your own password before continuing.{{else}}Changing it signs you out on every other device.{{end}}</p>
</div></div></div>
<div class="container page">
  <form method="post" action="/account/password" class="form">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    {{with .Data.Error}}<p class="alert alert-error" role="alert">{{.}}</p>{{end}}
    <label class="field"><span>Current password</span>
      <input type="password" name="current" autocomplete="current-password" maxlength="256" required>
    </label>
    <label class="field"><span>New password</span>
      <input type="password" name="new" autocomplete="new-password" minlength="10" maxlength="128" required>
      <span class="hint">At least 10 characters, with a letter and a number.</span>
    </label>
    <label class="field"><span>Repeat new password</span>
      <input type="password" name="confirm" autocomplete="new-password" minlength="10" maxlength="128" required>
    </label>
    <div><button class="btn btn-primary">Save new password</button></div>
  </form>
</div>
{{end}}
